name: Security Scan (Strix)

# Runs an AI-driven, diff-scoped security scan (pentest) on every pull request.
# Only the files changed in the PR are tested, "quick" mode keeps it fast, and
# the job fails when validated vulnerabilities are found so insecure code is
# blocked before it merges.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   STRIX_LLM    - the model id, e.g. "openai/gpt-5.4" or "anthropic/claude-..."
#   LLM_API_KEY  - the provider API key for that model
# Docs: https://docs.strix.ai/integrations/github-actions

on:
  pull_request:

permissions:
  contents: read
  security-events: write   # needed to upload SARIF to code scanning

jobs:
  strix-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # required for diff-scope resolution

      - name: Install Strix
        run: curl -sSL https://strix.ai/install | bash

      - name: Run Security Scan
        env:
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          strix -n -t ./ \
            --scan-mode quick \
            --scope-mode diff \
            --diff-base "origin/${{ github.base_ref }}" \
            --max-budget 10

      # Don't fail open: a run that hits the hard budget stop exits 0 but leaves
      # run.json status "stopped", not "completed". Enforce completion explicitly.
      - name: Fail unless the scan completed
        if: success()
        run: |
          run_json=$(ls -t strix_runs/*/run.json | head -1)
          status=$(jq -r .status "$run_json")
          if [ "$status" != "completed" ]; then
            echo "Strix run status is '$status' — the scan did not complete (likely budget exhausted). Raise --max-budget." >&2
            exit 1
          fi

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: strix_runs
